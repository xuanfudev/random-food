<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gia Phả Nhóm | Sơ đồ mối quan hệ</title>
    <meta name="description" content="Ứng dụng giúp bạn quản lý và khám phá các mối quan hệ trong nhóm!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <!-- Floating Emojis Background -->
    <div class="floating-emojis" id="floatingEmojis"></div>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <span class="logo-icon">🌳</span>
            <span class="logo-text">Gia Phả Nhóm</span>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="main-content">
        <!-- Tree Section (Group Graph) -->
        <section class="section tree-section active" id="section-tree">
            <div class="hero-text">
                <h1 class="hero-title">
                    <span class="hero-line">Gia phả</span>
                    <span class="hero-line gradient-text">nhóm 👨‍👩‍👧‍👦</span>
                </h1>
                <p class="hero-subtitle">Thiết lập và khám phá các mối quan hệ "bí mật" trong nhóm</p>
            </div>
            
            <div class="group-graph-container">
                <!-- Controls Panel -->
                <div class="graph-controls">
                    <div class="control-card">
                        <h3>👤 Thêm Thành Viên</h3>
                        <div class="form-group">
                            <input type="text" id="memberName" placeholder="Tên thành viên..." autocomplete="off"/>
                        </div>
                        <div class="form-group">
                            <select id="memberRole">
                                <option value="member">Thành viên</option>
                                <option value="leader">Trưởng nhóm</option>
                                <option value="vice">Phó nhóm</option>
                            </select>
                        </div>
                        <button class="action-btn primary small-btn" id="addMemberBtn">Thêm người</button>
                    </div>

                    <div class="control-card">
                        <h3>🔗 Thêm Quan Hệ</h3>
                        <div class="form-group">
                            <select id="relPersonA">
                                <option value="">-- Chọn người A --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <select id="relPersonB">
                                <option value="">-- Chọn người B --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <select id="relType">
                                <option value="nguoi-yeu">Người yêu 💖</option>
                                <option value="map-mo">Mập mờ 💜</option>
                                <option value="ban-than">Bạn thân 🤝</option>
                                <option value="ke-thu">Kẻ thù ⚡</option>
                                <option value="sep">Sếp / Lính 👑</option>
                            </select>
                        </div>
                        <button class="action-btn primary small-btn" id="addRelBtn">Gắn kết</button>
                    </div>

                    <div class="control-card">
                        <h3>✨ Loại Quan Hệ Mới</h3>
                        <div class="form-group">
                            <input type="text" id="customRelName" placeholder="Tên loại (vd: Oan gia)..." autocomplete="off"/>
                        </div>
                        <div class="form-group" style="display: flex; gap: 10px; align-items: center;">
                            <label for="customRelColor" style="font-size: 0.9rem; color: var(--text-primary);">Màu sắc:</label>
                            <input type="color" id="customRelColor" value="#00ffcc" style="padding: 0; width: 40px; height: 30px; border: none; cursor: pointer; background: transparent;"/>
                        </div>
                        <button class="action-btn primary small-btn" id="addCustomRelBtn">Tạo loại mới</button>
                    </div>

                    <div class="control-card">
                        <button class="action-btn secondary small-btn w-100" id="clearGraphBtn">🗑️ Làm mới toàn bộ</button>
                    </div>
                </div>

                <!-- Graph Canvas -->
                <div class="graph-area" id="graphArea">
                    <svg class="graph-lines" id="graphLines"></svg>
                    <div class="graph-nodes" id="graphNodes">
                        <!-- Nodes will be injected here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Made with 🧡 for you</p>
        <p class="footer-sub">© 2025 Gia Phả Nhóm</p>
    </footer>

    <script src="app.js?v=2"></script>
</body>
</html>
